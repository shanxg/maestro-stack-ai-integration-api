# =========================================================================
# 📡 KUBERNETES MANIFEST: MAESTRO API SERVICE
# =========================================================================
# The Service acts as the cluster's gateway and load balancer.
# Since Pods have dynamic IPs, the Service provides a stable address
# so external clients can reach the API without interruption.

apiVersion: v1
kind: Service
metadata:
  name: maestro-api-service      # Unique network service name in the cluster
  namespace: default             # Must share the Pods' namespace to find them
  labels:
    app: maestro-api             # Organizational catalog label
spec:
  # 🔀 EXPOSURE TYPE (NodePort): Suitable for local development clusters.
  # It opens a high-numbered port on the cluster host, allowing
  # a Windows browser to communicate with Pods from outside Kubernetes.
  type: NodePort

  # The selector tells the Service exactly where to route incoming traffic.
  selector:
    app: maestro-api             # Route requests to Pods with this label

  ports:
    - name: http-rest            # Identifier for the REST and GraphQL API channel
      protocol: TCP              # Reliable packet transmission protocol
      
      # 🚪 SERVICE PORT: Port used by other internal components to communicate
      port: 3000
      
      # 🎯 CONTAINER PORT: Port where the Node.js application listens inside the Pod
      targetPort: 3000
      
      # 🌐 EXTERNAL PORT (NodePort): Port Kubernetes opens on the host.
      # Use the fixed port '30100' (Kubernetes accepts ports 30000 through 32767).
      # Access the API at http://localhost:30100 on Windows.
      nodePort: 30100
