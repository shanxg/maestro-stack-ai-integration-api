# =========================================================================
# 🌌 KUBERNETES MANIFEST: MAESTRO API DEPLOYMENT
# =========================================================================
# The Deployment manages Pod health, self-healing, and the number of running replicas.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: maestro-api-deployment    # Unique manager name within the cluster
  namespace: default              # Isolated logical group (default namespace)
  labels:
    app: maestro-api              # Organizational label for cataloging resources
spec:
  # 🏭 REQUIREMENT: Keep two identical API replicas running in parallel.
  # If a Pod fails or runs out of memory, Kubernetes starts a replacement.
  replicas: 2
  
  # The selector tells the Deployment which Pods to monitor and manage.
  selector:
    matchLabels:
      app: maestro-api            # Manage only Pods with this exact label
  
  # The template defines how to create each new Pod.
  template:
    metadata:
      labels:
        app: maestro-api          # Label added to the Pod for selector matching
    spec:
      # 🛑 GRACEFUL SHUTDOWN (issue #51): on SIGTERM the API stops accepting work and closes its
      # connections within settings.health.shutdownTimeoutMs (10 s); Kubernetes sends SIGKILL only
      # after this period, so the shutdown always has time to finish.
      terminationGracePeriodSeconds: 30
      # 🛡️ POD SECURITY CONTEXT: Run as the unprivileged 'node' user (UID/GID 1000 in the
      # official Node.js image) and apply the container runtime's default seccomp filter.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault      
      containers:
        - name: maestro-api-container   # Container name within the Pod
          
          # 🔥 Use the exact local image loaded with 'kind load'
          image: maestro-api:v1          

          # Since the image is local to the Kind node, tell Kubernetes
          # NOT to pull it from Docker Hub, avoiding 'ErrImagePull' failures.
          imagePullPolicy: IfNotPresent
          
          # 🛡️ CONTAINER SECURITY CONTEXT: No privilege escalation, no Linux capabilities,
          # and a read-only filesystem (the API only reads dist/ at runtime).
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      
          # =========================================================================
          # 💎 RESOURCE REQUESTS AND COMPUTE LIMITS
          # =========================================================================
          # Satisfies the linter and protects the cluster from memory exhaustion.
          # Technical note: 100m (millicores) equals 10% of one CPU core.
          resources:
            requests:
              memory: "64Mi"        # Reserve at least 64 MiB of memory for startup
              cpu: "100m"           # Reserve at least 10% of one CPU for the asynchronous event loop
            limits:
              memory: "256Mi"       # Maximum: Kubernetes restarts the Pod if the API exceeds 256 MiB
              cpu: "500m"           # Maximum: Limit the container to 50% of one CPU core
          
          # Expose the internal port where the Node.js container listens for traffic
          ports:
            - containerPort: 3000

          # =========================================================================
          # 🩺 HEALTH PROBES (issue #51)
          # =========================================================================
          # Liveness: restart the container only when the process stops answering. It checks no
          # dependency, so a database outage does not restart every replica at once.
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          # Readiness: send traffic only while PostgreSQL and RabbitMQ answer and the replica is not
          # shutting down (it answers 503 from the first moment of a graceful shutdown).
          readinessProbe:
            httpGet:
              path: /api/v1/health/ready
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 2
          
          # =========================================================================
          # 🔐 DEPENDENCY CONFIGURATION (ENVIRONMENT VARIABLES / FINOPS)
          # =========================================================================
          # Inject values directly into the container environment (process.env).
          # IMPORTANT: In AWS production, use isolated Secrets or ConfigMaps.
          env:
            - name: NODE_ENV
              value: "production"
            
            - name: PORT
              value: "3000"

            # APPSEC REMEDIATION - INJECTING FROM VAULT (CWE-798)
            # Replaced hardcoded text value token with a secure reference linkage
            # targeting our isolated Kubernetes Secret container mapping.
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: maestro-api-secret
                  key: jwt-secret

            # INFRASTRUCTURE REMEDIATION - PARITY MODULE SYNCHRONIZATION
            # Aligned variable names to match exactly what the UserRepository pool reads.
            # We map the cluster internal connection gateway coordinates.
            - name: POSTGRES_HOST
              value: "postgres-service" # Targets the database internal cluster DNS
            
            - name: POSTGRES_PORT
              value: "5432" # Standard internal container port inside isolated K8s network meshes

            # Required by src/config.ts: the API has no default database password (CRED-04).
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: maestro-api-secret
                  key: postgres-password

            - name: REDIS_HOST
              value: "redis-service"

            # Required by src/config.ts: Redis must require a password (CRED-06).
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: maestro-api-secret
                  key: redis-password

            - name: RABBIT_HOST
              value: "rabbitmq-service"

            # Required by src/config.ts: the broker account, never the default guest user (CRED-05).
            - name: RABBIT_USER
              valueFrom:
                secretKeyRef:
                  name: maestro-api-secret
                  key: rabbit-user

            - name: RABBIT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: maestro-api-secret
                  key: rabbit-password

            # Browser origins trusted for CORS and the CSRF Origin check (issue #120): set the deployed
            # frontend's origin here. Without it the API trusts only the local development origins, so
            # the browser frontend is refused (fail closed). Wildcards and paths are rejected at boot.
            # - name: ALLOWED_ORIGINS
            #   value: "https://maestro.example.com"
              
