# =========================================================================
# 🌌 KUBERNETES MANIFEST: MAESTRO API DEPLOYMENT
# =========================================================================
# The Deployment manages Pod health, self-healing, and the number of running replicas.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: maestro-api-deployment    # Unique manager name within the cluster
  namespace: default              # Isolated logical group (default namespace)
  labels:
    app: maestro-api              # Organizational label for cataloging resources
spec:
  # 🏭 REQUIREMENT: Keep two identical API replicas running in parallel.
  # If a Pod fails or runs out of memory, Kubernetes starts a replacement.
  replicas: 2
  
  # The selector tells the Deployment which Pods to monitor and manage.
  selector:
    matchLabels:
      app: maestro-api            # Manage only Pods with this exact label
  
  # The template defines how to create each new Pod.
  template:
    metadata:
      labels:
        app: maestro-api          # Label added to the Pod for selector matching
    spec:
      containers:
        - name: maestro-api-container   # Container name within the Pod
          
          # 🔥 Use the exact local image loaded with 'kind load'
          image: maestro-api:v1
          
          # Since the image is local to the Kind node, tell Kubernetes
          # NOT to pull it from Docker Hub, avoiding 'ErrImagePull' failures.
          imagePullPolicy: IfNotPresent

          # =========================================================================
          # 💎 RESOURCE REQUESTS AND COMPUTE LIMITS
          # =========================================================================
          # Satisfies the linter and protects the cluster from memory exhaustion.
          # Technical note: 100m (millicores) equals 10% of one CPU core.
          resources:
            requests:
              memory: "64Mi"        # Reserve at least 64 MiB of memory for startup
              cpu: "100m"           # Reserve at least 10% of one CPU for the asynchronous event loop
            limits:
              memory: "256Mi"       # Maximum: Kubernetes restarts the Pod if the API exceeds 256 MiB
              cpu: "500m"           # Maximum: Limit the container to 50% of one CPU core
          
          # Expose the internal port where the Node.js container listens for traffic
          ports:
            - containerPort: 3000
          
          # =========================================================================
          # 🔐 DEPENDENCY CONFIGURATION (ENVIRONMENT VARIABLES / FINOPS)
          # =========================================================================
          # Inject values directly into the container environment (process.env).
          # IMPORTANT: In AWS production, use isolated Secrets or ConfigMaps.
          env:
            - name: NODE_ENV
              value: "production"   # Enable optimized API and Helmet production modes
            - name: PORT
              value: "3000"         # Set the internal HTTP server port
            - name: JWT_SECRET
              value: "maestro_secret_key_2026_super_secure_protection_token" # Secret configured in .env
              # 🔥 Allow the API in Kubernetes to connect to Redis on Windows
            - name: REDIS_HOST
              value: "host.docker.internal"
            - name: RABBIT_HOST
              value: "host.docker.internal"
            - name: DB_HOST
              value: "host.docker.internal"    # 🔥 Prepare for the future Postgres connection

              
