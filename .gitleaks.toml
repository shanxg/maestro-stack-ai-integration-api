title = "Gitleaks config for maestro-stack-ai-integration-api"

[extend]
useDefault = true

[allowlist]
description = "Placeholders didáticos e arquivos locais não versionados"
paths = [
  '''README\.md$''',
  '''\.env\.example$''',
  '''secret\.yaml\.example$''',
  '''^\.env$''',
  '''^k8s/secret\.yaml$''',
  '''^frontend/\.next/''',
]
regexes = [
  '''YOUR_TOKEN_HERE''',
  '''<token>''',
  '''REPLACE_ME''',
]