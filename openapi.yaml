# src/openapi.yaml
openapi: 3.0.3
info:
  title: Project Maestro - Scalable and Secure API
  description: >
    Technical documentation of the user management endpoints, with support
    for asynchronous messaging on RabbitMQ, cache-aside on Redis and a cryptographic firewall.
  version: 1.0.0

paths:
  # INFRASTRUCTURE REMEDIATION: Path corrected to reflect the real route prefix isolating REST from Apollo Server
  /api/v1/users:
    get:
      summary: List users with pagination
      description: Retrieves slices of the user array with dynamic Cache-Aside support on Redis.
      security:
        - BearerAuth: [] # Protected endpoint by the firewall middleware
      parameters:
        - name: limit
          in: query
          description: Maximum number of records returned in the page.
          required: false
          schema:
            type: integer
            default: 10
        - name: offset
          in: query
          description: Number of records skipped at the start of the query.
          required: false
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Operation completed successfully.
        '401':
          description: Access denied because the JWT is missing or invalid.
        '500':
          description: Internal failure in the data server.

    post:
      summary: Submit a registration request to the messaging queue
      description: Receives the identification parameters, computes the Bcrypt hash at the edge and enqueues the request on RabbitMQ asynchronously.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegistrationPayload'
      responses:
        '202':
          description: Request accepted for asynchronous batch processing in the queue.
        '400':
          description: Invalid request because it breaks the payload contract or misses required parameters.
        '500':
          description: Internal infrastructure error while dispatching the request to the event queue.

  /ai/chat:
    post:
      summary: Send a prompt to the Maestro virtual assistant
      description: Route protected by the JWT firewall that forwards the user's question to the local Llama 3 model.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - prompt
              properties:
                prompt:
                  type: string
                  description: Business question or command sent to the AI.
      responses:
        '200':
          description: Response generated and returned successfully by the AI.
          content:
            application/json:
              schema:
                type: object
                properties:
                  response:
                    type: string
                    description: Text response generated by the local model.
        '400':
          description: Invalid request because the "prompt" key is missing from the payload.
        '401':
          description: Access denied because the JWT is missing, expired or invalid.
        '500':
          description: Failure communicating with the local Ollama service.

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Enter the JWT obtained from the /auth/login endpoint to unlock the AI firewall.

  schemas:
    UserRegistrationPayload:
      type: object
      required:
        - name
        - email
        - password # APPSEC REMEDIATION: Explicitly mapping password requirement parameter
      properties:
        name:
          type: string
          example: "Lucas Rivaldo"
          minLength: 3
          description: Full name of the requesting user.
        email:
          type: string
          format: email
          example: "lucas@example.com"
          description: RFC-compliant email address used as the login credential.
        password:
          type: string
          format: password
          example: "********"
          minLength: 8
          description: Password (minimum of 8 characters to meet corporate security rules).
