# openapi.yaml
openapi: 3.0.3
info:
  title: Project Maestro - Scalable and Secure API
  description: >
    REST and Server-Sent Events endpoints of the Maestro API: JWT login, user
    registration through a RabbitMQ queue, user reads with a Redis cache-aside layer,
    a chat endpoint backed by a local LLM (Ollama) and a real-time event stream.
  version: 1.0.0

servers:
  - url: http://localhost:3000
    description: Local development (npm run dev)

# Secure by default: every operation requires a JWT unless it overrides this with `security: []`.
security:
  - BearerAuth: []

paths:
  /auth/login:
    post:
      summary: Exchange email and password for a JWT
      description: >
        Checks the credentials against the bcrypt hash stored in PostgreSQL and returns
        a JWT that expires in 1 hour. Unknown emails and wrong passwords get the same 401
        response body (CWE-204), and an unknown email is also compared against a dummy bcrypt
        hash with the same cost, so the response time does not reveal which accounts exist (CWE-208).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
              properties:
                username:
                  type: string
                  format: email
                  example: "lucas@example.com"
                  description: Email address of the account (the frontend sends it in the username field).
                password:
                  type: string
                  format: password
                  example: "********"
      responses:
        '200':
          description: Valid credentials; the JWT is in the response body.
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    description: HS256 JWT, valid for 1 hour, with the claims id, user, email and role (USER or ADMIN, from the database), plus iss and aud set to maestro-api.
        '400':
          description: >
            The username or password field is missing, blank or not a string (for example, a number).
            Each failing field is listed in error.details. A body that is not valid JSON gets code
            INVALID_REQUEST_BODY instead, without details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: VALIDATION_FAILURE
                  message: "Falha na validação dos dados de entrada."
                  details:
                    - field: body.username
                      message: "O e-mail (username) é obrigatório e precisa ser um texto."
        '401':
          description: Invalid credentials. Unknown emails and wrong passwords get this same response.
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /users:
    get:
      summary: List users with pagination (admins only)
      description: >
        Retrieves slices of the user array with dynamic Cache-Aside support on Redis.
        Only accounts with the ADMIN role (set in the database and carried in the JWT) may list
        users; any other account gets 403 before the cache or the database is read.
        Invalid pagination values are rejected with 400 before the database is queried.
      parameters:
        - name: limit
          in: query
          description: Maximum number of records returned in the page.
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
        - name: offset
          in: query
          description: Number of records skipped at the start of the query.
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Operation completed successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '400':
          description: limit or offset is not a whole number in the allowed range. Each failing parameter is listed in error.details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: VALIDATION_FAILURE
                  message: "Falha na validação dos dados de entrada."
                  details:
                    - field: query.limit
                      message: "O limit deve ser no máximo 100."
        '401':
          description: Access denied because the JWT is missing or invalid.
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /users/me:
    get:
      summary: Get the caller's own user record
      description: >
        Reads the record of the account in the JWT. The id comes from the verified token, never
        from the URL. The password hash is never returned.
      responses:
        '200':
          description: The caller's record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Access denied because the JWT is missing, expired or invalid.
        '404':
          description: The account in the token no longer exists.
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /users/{id}:
    get:
      summary: Get a user by ID (own record, or any record for admins)
      description: >
        Reads a single user from PostgreSQL. A regular account may read only its own id
        (GET /users/me does the same without the id); admins may read any id. Another account's
        id gets 403 whether that account exists or not. The password hash is never returned.
      parameters:
        - name: id
          in: path
          required: true
          description: Identifier of the user (a UUID generated when the user is created).
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: User found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: The ID is blank.
        '401':
          description: Access denied because the JWT is missing, expired or invalid.
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No user exists with this ID (only an admin or the owner gets this far).
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/users:
    post:
      summary: Submit a registration request to the messaging queue
      description: Receives the identification parameters, computes the Bcrypt hash at the edge and enqueues the request on RabbitMQ asynchronously.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegistrationPayload'
      responses:
        '202':
          description: >
            Request accepted for asynchronous batch processing in the queue. Known issue: the
            response is the same when the email is already registered; the worker then drops
            the message and the user is not created (tracked in issue #50).
        '400':
          description: >
            The body fails the Zod validation schema. Each failing field is listed in error.details.
            A body that is not valid JSON gets code INVALID_REQUEST_BODY instead, without details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: VALIDATION_FAILURE
                  message: "Falha na validação dos dados de entrada."
                  details:
                    - field: body.email
                      message: "Insira um formato de e-mail válido (exemplo: usuario@email.com)."
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: >
            The message broker (RabbitMQ) is unavailable, so the request was not queued and no
            user will be created. The client can send the same request again later.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: SERVICE_UNAVAILABLE
                  message: "O serviço de cadastro está temporariamente indisponível. Tente novamente em instantes."

  /ai/chat:
    post:
      summary: Send a prompt to the Maestro virtual assistant
      description: >
        Route protected by the JWT firewall that forwards the user's question to the configured
        model (OPENAI_MODEL, a local Llama 3 on Ollama by default). Every call is bounded: the
        prompt is limited to 2000 characters, the answer to 512 tokens (max_tokens), and the
        model server gets 60 seconds to answer, without automatic retries. The model receives
        only a fixed system prompt and the user's prompt, with no user data and no tools.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - prompt
              properties:
                prompt:
                  type: string
                  minLength: 1
                  maxLength: 2000
                  description: >
                    Business question or command sent to the AI. Surrounding spaces are removed
                    before the length check.
      responses:
        '200':
          description: Response generated and returned successfully by the AI.
          content:
            application/json:
              schema:
                type: object
                properties:
                  response:
                    type: string
                    description: Text response generated by the model, at most 512 tokens long.
        '400':
          description: >
            The prompt field is missing, blank, not a string or longer than 2000 characters
            (code VALIDATION_FAILURE), or the body is not valid JSON (code INVALID_REQUEST_BODY).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: VALIDATION_FAILURE
                  message: "Falha na validação dos dados de entrada."
                  details:
                    - field: body.prompt
                      message: "O prompt pode ter no máximo 2000 caracteres."
        '401':
          description: Access denied because the JWT is missing, expired or invalid.
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: >
            The model server cannot be reached or did not answer within 60 seconds. The client
            can send the prompt again later.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: AI_SERVICE_UNAVAILABLE
                  message: "O assistente de IA está indisponível no momento. Tente novamente em instantes."

  /events:
    get:
      summary: Subscribe to real-time events (Server-Sent Events)
      description: >
        Opens a long-lived text/event-stream connection. The first message is
        {"status": "CONNECTED_TO_MAESTRO_STREAM"}; after that, every event consumed from
        RabbitMQ is pushed as an "event:" line with the action name and a "data:" line with JSON.
        For user_created the data carries the new user's name and email, never the password hash.
        Known issue: the stream has no authentication and sends Access-Control-Allow-Origin: *,
        so anyone can read these events (tracked in issue #35).
      security: []
      responses:
        '200':
          description: Stream opened. The connection stays open until the client closes it.
          content:
            text/event-stream:
              schema:
                type: string
              example: |
                data: {"status": "CONNECTED_TO_MAESTRO_STREAM"}

                event: user_created
                data: {"name":"Lucas Rivaldo","email":"lucas@example.com"}
        '429':
          $ref: '#/components/responses/TooManyRequests'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Send the JWT returned by POST /auth/login in the Authorization header, as Bearer followed
        by the token. Tokens are signed with HS256 and carry the issuer and audience "maestro-api";
        the API rejects any token with another algorithm, issuer or audience, an invalid signature
        or an expired "exp" claim, always with the same 401 INVALID_TOKEN response.

  responses:
    Forbidden:
      description: >
        The account in the JWT is valid but may not perform this operation: listing users is for
        admins only, and a regular account may read only its own record (OWASP API1:2023 and API5:2023).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: FORBIDDEN
              message: "Apenas administradores podem listar os usuários."

    TooManyRequests:
      description: >
        Rate limit exceeded. Every route shares a global limit of 100 requests per IP every
        15 minutes (code TOO_MANY_REQUESTS). /auth/login also allows only 5 attempts per IP
        every 5 minutes (code AUTH_FLOOD_DETECTED), and /ai/chat only 10 prompts per account
        (the user id in the JWT) per minute (code LLM_COMPUTE_LIMIT_EXCEEDED), so users who
        share one IP address do not block each other. The counters are kept in Redis, so every API
        replica counts the same hits. While Redis is unavailable, each replica falls back to its
        own in-memory counters.
      headers:
        Retry-After:
          description: Seconds until the client can send requests again.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    InternalError:
      description: >
        Unexpected internal failure, for example PostgreSQL, Redis or the local Ollama service
        failing. The central error handler logs the full error on the server and answers this
        fixed envelope, without the internal error message or any details (CWE-209).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: INTERNAL_SERVER_ERROR
              message: "Erro interno no servidor. Tente novamente mais tarde."

  schemas:
    User:
      type: object
      description: Public view of a user. The password hash is never included.
      required:
        - id
        - name
        - email
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: "Lucas Rivaldo"
        email:
          type: string
          format: email
          example: "lucas@example.com"

    Error:
      type: object
      description: >
        Error envelope shared by the REST routes. Clients should branch on error.code;
        error.message is human-readable text, currently a mix of Portuguese and English.
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              example: TOO_MANY_REQUESTS
            message:
              type: string
            details:
              description: >
                Present only on validation failures (code VALIDATION_FAILURE), with one entry per
                failing field. No other error carries details: internal error messages, stack
                traces and JWT verification errors stay in the server log (CWE-209).
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                    example: body.email
                  message:
                    type: string

    UserRegistrationPayload:
      type: object
      required:
        - name
        - email
        - password # APPSEC REMEDIATION: Explicitly mapping password requirement parameter
      properties:
        name:
          type: string
          example: "Lucas Rivaldo"
          minLength: 3
          description: Full name of the requesting user.
        email:
          type: string
          format: email
          example: "lucas@example.com"
          description: RFC-compliant email address used as the login credential.
        password:
          type: string
          format: password
          example: "********"
          minLength: 8
          description: Password (minimum of 8 characters to meet corporate security rules).
