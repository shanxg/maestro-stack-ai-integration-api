
services:
  # 1. Relational database service
  postgres:
    # Pin the major version: a new major cannot open the existing data directory.
    image: postgres:18
    container_name: pg_integrated
    environment:
      # Read from .env: no default password in the repository (CRED-04). Compose stops if it is unset.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}
    ports:
      - "5433:5432" # 👈 Keep host port 5433 to avoid conflicting with PostgreSQL on Windows

  # 2. In-memory cache service
  redis:
    image: redis:8
    container_name: redis_integrated
    ports:
      - "6379:6379"

  # 3. Messaging service
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: rabbit_integrated
    ports:
      - "5672:5672"
      - "15672:15672"
