
services:
  # 1. Relational database service
  postgres:
    # Pin the major version: a new major cannot open the existing data directory.
    image: postgres:18
    container_name: pg_integrated
    environment:
      # Read from .env: no default password in the repository (CRED-04). Compose stops if it is unset.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}
    ports:
      # Host only (127.0.0.1): other machines on the network cannot reach the database (CWE-1327).
      # Host port 5433 avoids a conflict with a PostgreSQL installed on Windows.
      - "127.0.0.1:5433:5432"

  # 2. In-memory cache service
  redis:
    image: redis:8
    container_name: redis_integrated
    environment:
      # Read from .env, like the PostgreSQL and RabbitMQ passwords (CRED-06). Compose stops if it is unset.
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env (see .env.example)}
    # requirepass turns on authentication. "$$" makes Compose pass a literal "$", so the shell inside
    # the container expands the variable: the value is not written in this file or in the command line.
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\""]
    ports:
      - "127.0.0.1:6379:6379" # Host only: other machines on the network cannot reach Redis

  # 3. Messaging service
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: rabbit_integrated
    environment:
      # The broker creates this account on its first start instead of the default guest user (CRED-05).
      RABBITMQ_DEFAULT_USER: ${RABBIT_USER:?Set RABBIT_USER in .env (see .env.example)}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASSWORD:?Set RABBIT_PASSWORD in .env (see .env.example)}
    ports:
      # Host only (127.0.0.1): the broker (5672) and its management web UI (15672) are not
      # reachable from other machines on the network (CWE-1327).
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
