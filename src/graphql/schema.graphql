# 1. TYPE DEFINITION (MODEL): Defines the exact shape of the User object in GraphQL.
# The '!' character means the field is required and can never be null (Non-Null).
type User {
  id: ID!
  name: String!
  email: String!
}

# 2. READ OPERATIONS (QUERIES): Define the entry points for fetching data.
type Query {
  # Return an array of users. Neither the array nor its items can be null.
  users: [User!]!

  # Find a user by required ID. The result may be a User or null.
  user(id: ID!): User
}

# 3. WRITE OPERATIONS (MUTATIONS): Define the entry points for modifying data.
type Mutation {
  # Create a user from required name and email values, then return the created User.
  createUser(name: String!, email: String!, password: String!): User!
}
