name: Sync README with security documents

# Copies SECURITY.md and docs/security/remediation-log.md into the "Security Policies" section at the
# end of README.md (between the md:include markers) whenever one of them changes on main.
on:
  push:
    branches: [main]
    paths:
      - 'SECURITY.md'
      - 'docs/security/remediation-log.md'
      # The README itself (if the markers are edited) and the sync tooling.
      - 'README.md'
      - 'scripts/sync-readme.mjs'
      - '.github/workflows/sync-readme.yml'
  # Allows running it by hand from the Actions tab.
  workflow_dispatch:

# Read-only by default; only the job below may push.
permissions:
  contents: read

# One sync at a time, so two quick pushes to main cannot race to push README.md.
concurrency:
  group: sync-readme
  cancel-in-progress: false

jobs:
  sync-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to push the updated README.md
      actions: write # Needed to start the Secret Scanning workflow for the pushed commit
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # The sync is a dependency-free script kept in this repository (no third-party action, no npm install).
      - name: Copy the security documents into README.md
        run: node scripts/sync-readme.mjs

      # Commits only when the copy changed. A push made with the workflow's GITHUB_TOKEN does not start
      # new workflow runs, so this commit cannot trigger the sync again. The step records whether it
      # pushed, for the scan below.
      - name: Commit and push README.md
        id: push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --staged --quiet; then
            echo "README.md is already in sync; nothing to commit."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "docs(readme): sync the security sections"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # The same rule means the README commit would never get the Secret Scanning run that every other
      # push to main gets. workflow_dispatch is the exception GitHub allows for the workflow token, so
      # start Secret Scanning on main by hand: it runs Gitleaks on the commit just pushed.
      - name: Scan the pushed commit for secrets
        if: steps.push.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run secret-scan.yml --ref main
