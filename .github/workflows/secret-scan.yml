name: Secret Scanning

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# LEAST PRIVILEGE (CWE-250, issue #143): the token can read the code and the pull request it scans,
# and nothing else. Without this block it would get the repository's default permissions, a setting
# that lives outside code review.
permissions:
  contents: read # Check out the full history
  pull-requests: read # List the commits of the pull request being scanned

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # PINNED THIRD-PARTY ACTION (CWE-829, issue #143): a tag such as "v3" can be moved to other code
      # by whoever controls the action's repository; a commit SHA cannot. The comment names the
      # release, and Dependabot (github-actions ecosystem) updates both when a new one is published.
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # PR comments need pull-requests: write, which this read-only token does not have. A leak
          # still fails the job and is listed in the job summary.
          GITLEAKS_ENABLE_COMMENTS: false
