version: 2

# GROUPS (issue #57): minor and patch updates of one directory arrive together in a single weekly
# pull request, which CI checks as one change; major updates still come one per pull request,
# since each may break something and needs its own review. Security updates are not grouped:
# Dependabot opens them as soon as an advisory is published.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  # The API's ESLint toolchain (see tools/lint/eslint.config.js for why it is a separate package).
  - package-ecosystem: npm
    directory: /tools/lint
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # typescript-eslint supports TypeScript < 6.1 only, so this copy stays on 6.0.x.
      # Revisit when typescript-eslint supports TypeScript 7.
      - dependency-name: typescript
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # typescript-eslint (loaded by eslint-config-next) refuses TypeScript 7:
      # "typescript-eslint does not support TS 7.0". Revisit when it adds support.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # eslint-config-next 16 ships plugins (import, jsx-a11y, react) whose peer
      # range stops at ESLint 9. Revisit when eslint-config-next supports ESLint 10.
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Only even-numbered (LTS) Node.js majors are adopted, and by hand
      # (see CONT-01 in docs/security/remediation-log.md).
      - dependency-name: node
        update-types: ["version-update:semver-major"]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
